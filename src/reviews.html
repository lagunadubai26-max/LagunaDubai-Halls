<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام قاعات — تقييمات العملاء</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3"><script src="js/role-head.js?v=3"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="logo">🏛️</div><h1>نظام <b>قاعات</b><small>لاجونا دبي</small></h1></div>
      <nav>
        <a href="index.html"><i class="fa-solid fa-chart-line"></i><span>لوحة التحكم</span></a>
        <a href="bookings.html"><i class="fa-solid fa-calendar-days"></i><span>الحجوزات</span></a>
        <a href="contracts.html"><i class="fa-solid fa-file-signature"></i><span>العقود</span></a>
        <a href="packages.html" class="admin-only"><i class="fa-solid fa-box-open"></i><span>الباقات</span></a>
        <a href="addons.html" class="admin-only"><i class="fa-solid fa-plus-circle"></i><span>الإضافات</span></a>
        <a href="payments.html"><i class="fa-solid fa-money-bill-wave"></i><span>المدفوعات</span></a>
        <a href="hall-expenses.html"><i class="fa-solid fa-receipt"></i><span>مصروفات الأفراح</span></a>
        <a href="reports.html" class="no-employee"><i class="fa-solid fa-chart-simple"></i><span>التقارير</span></a>
        <a href="reviews.html" class="active"><i class="fa-solid fa-star"></i><span>تقييمات العملاء</span></a>
        <a href="halls.html" class="super-only"><i class="fa-solid fa-building-columns"></i><span>إدارة القاعات</span></a>
        <a href="settings.html" class="admin-only"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
      </nav>
      <div class="spacer"></div>
      <div class="profile">
        <div class="avatar" id="sidebarAvatar">?</div>
        <div><h4 id="sidebarName">...</h4><span id="sidebarRole">...</span><span id="sidebarHall" class="muted" style="font-size:11px"></span></div>
        <button class="btn-hall" id="hallSwitchBtn" title="تبديل القاعة"><i class="fa-solid fa-right-left"></i></button>
        <a href="auth.html" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>
    </aside>
    <main class="main">
      <div class="topbar"><h2>تقييمات العملاء</h2><div class="spacer"></div>
        <a class="btn ghost sm" href="https://lagunadubai26-max.github.io/LagunaDubai-Rating/" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> صفحة التقييمات</a>
      </div>
      <div class="grid cols-3">
        <div class="card stat"><div class="ic gold"><i class="fa-solid fa-star"></i></div><div><h3>متوسط التقييم</h3><b id="rAvg">0</b></div></div>
        <div class="card stat"><div class="ic green"><i class="fa-solid fa-thumbs-up"></i></div><div><h3>إيجابية</h3><b id="rPos">0</b></div></div>
        <div class="card stat"><div class="ic red"><i class="fa-solid fa-triangle-exclamation"></i></div><div><h3>سلبية (أقل من 3)</h3><b id="rNeg">0</b></div></div>
      </div>
      <div class="card mt">
        <div class="filters">
          <input type="text" id="revSearch" placeholder="ابحث في التعليقات...">
          <select id="revFilter"><option value="all">الكل</option><option value="pos">إيجابية</option><option value="neg">سلبية</option></select>
          <div class="spacer"></div><span class="muted" id="revCount"></span>
        </div>
        <div id="revList"><div class="empty">جاري تحميل التقييمات...</div></div>
      </div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=3"></script>
  <script src="js/firebase-client.js?v=3"></script>
  <script src="js/sanitize.js?v=3"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/reviews-reader.js?v=3"></script>
  <script src="js/guard.js?v=3"></script>
  <script src="js/role.js?v=3"></script>
  <script src="js/reviews.js?v=3"></script>
</body>
</html>
