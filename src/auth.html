<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام قاعات — تسجيل الدخول</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=21">
  <link rel="stylesheet" href="css/auth.css?v=21">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🏛️</div>
      <h1>نظام <span class="gold">قاعات</span></h1>
      <p class="auth-sub">إدارة قاعات الأفراح</p>
      <div id="authMsg" class="auth-msg"></div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <div class="in-wrap">
          <input type="email" id="loginEmail" placeholder="admin@laguna.com" autocomplete="email">
          <i class="fa-solid fa-envelope"></i>
        </div>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <div class="pass-wrap">
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pass-toggle" id="passToggle" title="إظهار / إخفاء كلمة المرور" aria-label="إظهار أو إخفاء كلمة المرور">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      <button class="btn auth-btn" id="loginBtn" style="width:100%"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=21"></script>
  <script src="js/firebase-client.js?v=21"></script>
  <script src="js/sanitize.js?v=21"></script>
  <script src="js/password-utils.js?v=21"></script>
  <script src="js/data.js?v=21"></script>
  <script src="js/auth.js?v=21"></script>
</body>
</html>
