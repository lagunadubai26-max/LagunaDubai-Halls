<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام قاعات — تسجيل الدخول</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
  <link rel="stylesheet" href="css/auth.css?v=7">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🏛️</div>
      <h1>نظام <span class="gold">قاعات</span></h1>
      <p class="auth-sub">لاجونا دبي — إدارة قاعات الأفراح</p>
      <div id="authMsg" class="auth-msg"></div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="admin@laguna.com" autocomplete="email">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn auth-btn" id="loginBtn" style="width:100%">تسجيل الدخول</button>
      <div class="auth-foot">
        🌹 rose@laguna.com / rose123 &nbsp;·&nbsp; 🎉 sukra@laguna.com / sukra123<br>
        ⛵ markab@laguna.com / markab123 &nbsp;·&nbsp; 🏛️ admin@laguna.com / admin123
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=7"></script>
  <script src="js/firebase-client.js?v=7"></script>
  <script src="js/sanitize.js?v=7"></script>
  <script src="js/password-utils.js?v=7"></script>
  <script src="js/data.js?v=7"></script>
  <script src="js/auth.js?v=7"></script>
</body>
</html>
