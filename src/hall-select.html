<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام قاعات — اختيار القاعة</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=13">
  <style>
    .pick-body{
      min-height:100vh;
      background:linear-gradient(135deg,#f8f6f3 0%,#f3efe9 50%,#fdf4e7 100%);
      padding:40px 20px;position:relative;overflow:hidden;
    }
    .pick-body::before,.pick-body::after{
      content:'';position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none;
    }
    .pick-body::before{width:420px;height:420px;background:rgba(217,119,6,.3);top:-140px;right:-140px}
    .pick-body::after{width:380px;height:380px;background:rgba(37,99,235,.12);bottom:-120px;left:-120px}
    .pick-wrap{max-width:940px;margin:0 auto;position:relative;z-index:1}
    .pick-head{text-align:center;margin-bottom:34px;animation:authIn .5s cubic-bezier(.34,1.56,.64,1) both}
    .pick-logo{
      width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:38px;
      background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;
      box-shadow:0 4px 20px rgba(217,119,6,.35);animation:logoFloat 4.5s ease-in-out infinite;
    }
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .pick-head h1{font-family:'Playfair Display','Cairo',serif;font-size:30px;color:#1c1917}
    .pick-head h1 span{color:#d97706}
    .pick-head .sub{color:#78716c;font-size:14px;margin-top:6px}
    .pick-head .greet{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:#fff;border:1px solid var(--border);
      padding:7px 16px;border-radius:999px;font-size:13px;color:#44403c;box-shadow:var(--shadow-sm)}
    .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
    .hall-card{
      background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px 20px 20px;
      cursor:pointer;position:relative;overflow:hidden;text-align:center;
      transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s,border-color .25s;
      animation:authIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .hall-card::before{content:'';position:absolute;top:-60%;left:-40%;width:70%;height:120%;transform:rotate(12deg);
      background:linear-gradient(135deg,rgba(217,119,6,.07),transparent);pointer-events:none}
    .hall-card:hover{transform:translateY(-6px);box-shadow:0 20px 44px rgba(0,0,0,.12);border-color:var(--accent)}
    .hall-card .h-ic{
      width:70px;height:70px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;font-size:34px;
      background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;
      transition:transform .25s;
    }
    .hall-card:hover .h-ic{transform:scale(1.08) rotate(-4deg);background:linear-gradient(135deg,#d97706,#f59e0b)}
    .hall-card h3{font-size:18px;color:#1c1917;font-weight:700}
    .hall-card .h-meta{color:#78716c;font-size:12px;margin-top:5px;min-height:18px}
    .hall-card .h-stat{margin:14px auto 4px;display:inline-flex;align-items:center;gap:6px;background:#f8f6f3;
      border:1px solid var(--border);color:#44403c;padding:5px 12px;border-radius:999px;font-size:12px}
    .hall-card .h-stat b{color:var(--accent-dark)}
    .hall-card .h-enter{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;
      background:linear-gradient(135deg,#1c1917,#44403c);color:#fef3c7;font-size:13px;font-weight:600;
      padding:10px;border-radius:12px;transition:var(--transition)}
    .hall-card:hover .h-enter{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff}
    .hall-card .h-enter i{transition:transform .25s}
    .hall-card:hover .h-enter i{transform:translateX(-4px)}
    .pick-foot{display:flex;justify-content:center;margin-top:34px}
    .pick-out{background:#fff;border:1px solid var(--border);color:#44403c;padding:10px 22px;border-radius:12px;
      font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);box-shadow:var(--shadow-sm)}
    .pick-out:hover{border-color:var(--danger);color:var(--danger)}
    @media (max-width:560px){.pick-head h1{font-size:24px}.pick-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="pick-body">
  <div class="pick-wrap">
    <div class="pick-head">
      <div class="pick-logo">🏛️</div>
      <h1>نظام <span>قاعات</span></h1>
      <div class="sub">اختر القاعة التي تريد العمل عليها</div>
      <div class="greet"><i class="fa-solid fa-user-gear" style="color:var(--accent)"></i> أهلًا بك، <b id="adminName">مدير النظام</b></div>
    </div>
    <div id="hallGrid" class="pick-grid"><div class="empty">جاري التحميل...</div></div>
    <div class="pick-foot"><button class="pick-out" id="backBtn"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=13"></script>
  <script src="js/firebase-client.js?v=13"></script>
  <script src="js/sanitize.js?v=13"></script>
  <script src="js/data.js?v=13"></script>
  <script src="js/hall-select.js?v=13"></script>
</body>
</html>
