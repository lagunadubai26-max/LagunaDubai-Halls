<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام قاعات — اختيار القاعة</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
  <style>
    .hall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .hall-pick { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px; cursor: pointer; transition: var(--transition); text-align: center; }
    .hall-pick:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .hall-pick .ic { width: 62px; height: 62px; margin: 0 auto 12px; display: grid; place-items: center; font-size: 30px; border-radius: 18px; background: #fffbeb; }
    .hall-pick:hover .ic { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .hall-pick h3 { font-size: 17px; color: var(--primary); font-weight: 700; }
    .hall-pick p { color: var(--muted); font-size: 12px; margin-top: 5px; }
  </style>
</head>
<body class="auth-body">
  <div class="auth-wrap" style="max-width:640px">
    <div class="auth-card">
      <div class="auth-logo">🏛️</div>
      <h1 style="margin-bottom:4px">اختر القاعة</h1>
      <p class="auth-sub">اختر القاعة التي تريد العمل عليها</p>
      <div id="hallGrid" class="hall-grid mt"><div class="empty">جاري التحميل...</div></div>
      <div class="mt flex"><button class="btn ghost sm" id="backBtn">تسجيل الخروج</button></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=5"></script>
  <script src="js/firebase-client.js?v=5"></script>
  <script src="js/sanitize.js?v=5"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/hall-select.js?v=5"></script>
</body>
</html>
