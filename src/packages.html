<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام قاعات — الباقات</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8"><script src="js/role-head.js?v=8"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="logo">🏛️</div><h1>نظام <b>قاعات</b></h1></div>
      <nav>
        <a href="index.html"><i class="fa-solid fa-chart-line"></i><span>لوحة التحكم</span></a>
        <a href="bookings.html"><i class="fa-solid fa-calendar-days"></i><span>الحجوزات</span></a>
        <a href="contracts.html"><i class="fa-solid fa-file-signature"></i><span>العقود</span></a>
        <a href="packages.html" class="active admin-only"><i class="fa-solid fa-box-open"></i><span>الباقات</span></a>
        <a href="addons.html" class="admin-only"><i class="fa-solid fa-plus-circle"></i><span>الإضافات</span></a>
        <a href="payments.html"><i class="fa-solid fa-money-bill-wave"></i><span>المدفوعات</span></a>
        <a href="hall-expenses.html"><i class="fa-solid fa-receipt"></i><span>مصروفات الأفراح</span></a>
        <a href="reports.html" class="no-employee"><i class="fa-solid fa-chart-simple"></i><span>التقارير</span></a>
        <a href="halls.html" class="super-only"><i class="fa-solid fa-building-columns"></i><span>إدارة القاعات</span></a>
        <a href="settings.html" class="admin-only"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
      </nav>
      <div class="spacer"></div>
      <div class="profile">
        <div class="avatar" id="sidebarAvatar">?</div>
        <div><h4 id="sidebarName">...</h4><span id="sidebarRole">...</span><span id="sidebarHall" class="muted" style="font-size:11px"></span></div>
        <button class="btn-hall" id="hallSwitchBtn" title="تبديل القاعة"><i class="fa-solid fa-right-left"></i></button>
        <a href="auth.html" class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>
    </aside>
    <main class="main">
      <div class="topbar"><h2>الباقات</h2><div class="spacer"></div><div class="hall-chip" id="hallChip"></div>
        <button class="btn" id="addBtn"><i class="fa-solid fa-plus"></i> باقة جديدة</button></div>
      <div class="grid" id="pkGrid"><div class="empty">جاري التحميل...</div></div>
    </main>
  </div>
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3 id="modalTitle">إضافة باقة <i class="fa-solid fa-xmark close" id="close"></i></h3>
      <div class="field"><label>اسم الباقة</label><input id="pName"></div>
      <div class="field"><label>السعر (ج.م)</label><input type="number" id="pPrice"></div>
      <div class="field"><label>وصف الباقة</label><textarea id="pDesc"></textarea></div>
      <div class="flex"><div class="spacer"></div><button class="btn" id="save">حفظ</button></div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=8"></script>
  <script src="js/firebase-client.js?v=8"></script>
  <script src="js/sanitize.js?v=8"></script>
  <script src="js/data.js?v=8"></script>
  <script src="js/guard.js?v=8"></script>
  <script src="js/role.js?v=8"></script>
  <script src="js/packages.js?v=8"></script>
</body>
</html>
